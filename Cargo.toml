[package]
name = "discord-inviter-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls-vendored"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
anyhow = "1.0.104"
axum = "0.8.9"
serde_json = "1.0.154"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
# The Rustls backend enables an obsolete TLS stack through tokio-tungstenite.
serenity = { version = "0.12.5", default-features = false, features = ["model", "native_tls_backend"] }
url = "2.5.8"
